name: Circum Rider CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rider:
    name: Rider analyze, tests and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Format changed Dart files
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          files=$(git diff --name-only "$base"...HEAD -- '*.dart')
          if [ -n "$files" ]; then
            dart format --output=none --set-exit-if-changed $files
          fi
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}"...HEAD
