name: Deploy Rider Web to Cloud Run

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Approved Rider commit or branch to deploy
        required: true
        default: main

jobs:
  deploy-rider-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - name: Capture checked-out release identity
        run: echo "RIDER_RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: flutter pub get
      - run: flutter test test/canonical_rider_entry_point_test.dart test/rider_startup_test.dart
      - run: node --test test/rider_deployment_manifest_test.js
      - name: Verify Rider App Check site key
        env:
          RIDER_WEB_APPCHECK_SITE_KEY: ${{ secrets.RIDER_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY }}
        run: test -n "$RIDER_WEB_APPCHECK_SITE_KEY"
      - name: Build Rider Web
        env:
          RIDER_WEB_APPCHECK_SITE_KEY: ${{ secrets.RIDER_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY }}
        run: flutter build web --release --dart-define=CIRCUM_RIDER_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY="$RIDER_WEB_APPCHECK_SITE_KEY"
      - run: node scripts/rider_deployment_manifest.js prepare
      - run: node scripts/rider_deployment_manifest.js verify
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIRCUM_2797C }}
      - name: Build and push Rider Web image
        env:
          IMAGE: us-central1-docker.pkg.dev/circum-2797c/cloud-run-source-deploy/circum-rider-web:${{ env.RIDER_RELEASE_SHA }}
        run: |
          BUILD_ID="$(gcloud builds submit \
            --async \
            --suppress-logs \
            --project circum-2797c \
            --tag "$IMAGE" \
            --format='value(id)' \
            .)"
          test -n "$BUILD_ID"
          for attempt in $(seq 1 60); do
            STATUS="$(gcloud builds describe "$BUILD_ID" \
              --project circum-2797c \
              --format='value(status)')"
            case "$STATUS" in
              SUCCESS) exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build failed with status: $STATUS"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo 'Cloud Build did not finish within the bounded wait.'
          exit 1
      - name: Deploy Rider Web to Cloud Run
        env:
          IMAGE: us-central1-docker.pkg.dev/circum-2797c/cloud-run-source-deploy/circum-rider-web:${{ env.RIDER_RELEASE_SHA }}
        run: |
          gcloud run deploy circum-rider-web \
            --project circum-2797c \
            --region us-central1 \
            --platform managed \
            --image "$IMAGE" \
            --port 8080 \
            --no-traffic \
            --tag rider-release \
            --update-env-vars "CIRCUM_SOURCE_SHA=${{ env.RIDER_RELEASE_SHA }}" \
            --labels "circum-source-sha=${{ env.RIDER_RELEASE_SHA }},circum-surface=rider-web"
          REVISION="$(gcloud run services describe circum-rider-web --project circum-2797c --region us-central1 --format='value(status.latestCreatedRevisionName)')"
          test -n "$REVISION"
          gcloud run services describe circum-rider-web --project circum-2797c --region us-central1 --format=json > /tmp/rider-release-service.json
          CANARY_URL="$(jq -r '.status.traffic[] | select(.tag == "rider-release") | .url' /tmp/rider-release-service.json)"
          test -n "$CANARY_URL"
          curl --fail --silent --show-error --retry 3 "$CANARY_URL/deployment-manifest.json" > /tmp/rider-canary-manifest.json
          jq -e --arg sha "$RIDER_RELEASE_SHA" '.gitCommit == $sha and .buildIdentity == "CIRCUM_BUILD_ID=rider-app"' /tmp/rider-canary-manifest.json
          gcloud run services update-traffic circum-rider-web --project circum-2797c --region us-central1 --to-revisions "$REVISION=100"
          gcloud run services describe circum-rider-web --project circum-2797c --region us-central1 --format=json > /tmp/rider-promoted-service.json
          jq -e --arg revision "$REVISION" 'any(.status.traffic[]; .revisionName == $revision and .percent == 100)' /tmp/rider-promoted-service.json
          PUBLIC_URL="$(jq -r '.status.url' /tmp/rider-promoted-service.json)"
          curl --fail --silent --show-error --retry 3 "$PUBLIC_URL/deployment-manifest.json" > /tmp/rider-public-manifest.json
          jq -e --arg sha "$RIDER_RELEASE_SHA" '.gitCommit == $sha' /tmp/rider-public-manifest.json
